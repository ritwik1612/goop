name: GOOP
options:
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    GOOP_APP_GROUP: group.$(GOOP_BUNDLE_ID)
targets:
  GOOP:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../fonts/D-DIN-Bold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOOP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/GOOP.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GOOP
        GOOPAppGroup: $(GOOP_APP_GROUP)
        GIDClientID: $(GID_CLIENT_ID)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: ['$(GID_REVERSED_CLIENT_ID)', goop]
        UILaunchScreen: {}
    dependencies:
      - target: GOOPWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
  GOOPWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: ../fonts/D-DIN-Bold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOOP_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/GOOPWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: GOOP Widgets
        GOOPAppGroup: $(GOOP_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
